<div class="page-header">
  <div>
    <h1>Edit User</h1>
    <p>Update user information</p>
  </div>

  <a routerLink="/users" class="back-btn"> Back </a>
</div>

<div class="form-card">
  <div *ngIf="isLoading" class="loading">Loading...</div>

  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <form *ngIf="!isLoading" (ngSubmit)="save()">
    <div class="form-group">
      <label>First Name</label>

      <input type="text" name="firstName" [(ngModel)]="user.firstName" required />
    </div>

    <div class="form-group">
      <label>Last Name</label>

      <input type="text" name="lastName" [(ngModel)]="user.lastName" required />
    </div>

    <div class="form-group">
      <label>Username</label>

      <input type="text" name="userName" [(ngModel)]="user.userName" required />
    </div>

    <div class="form-group">
      <label>Email</label>

      <input type="email" name="email" [(ngModel)]="user.email" required />
    </div>

    <div class="form-group">
      <label>Profile Image</label>

      <input
        type="text"
        name="profileImage"
        [(ngModel)]="user.profileImage"
        placeholder="Profile image path"
      />
    </div>

    <div class="checkbox-group">
      <input id="isActive" type="checkbox" name="isActive" [(ngModel)]="user.isActive" />

      <label for="isActive"> Active </label>
    </div>

    <div class="form-actions">
      <a routerLink="/users" class="cancel-btn"> Cancel </a>

      <button type="submit" [disabled]="isSaving">
        {{ isSaving ? 'Saving...' : 'Update User' }}
      </button>
    </div>
  </form>
</div>
