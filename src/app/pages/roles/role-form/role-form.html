<div class="page-header">
  <div>
    <h1>
      {{ isEditMode ? 'Edit Role' : 'Add Role' }}
    </h1>

    <p>
      {{ isEditMode ? 'Update role information' : 'Create a new user role' }}
    </p>
  </div>
</div>

<!-- Loading -->

<div *ngIf="isLoading" class="message">Loading role...</div>

<!-- Form -->

<div *ngIf="!isLoading" class="form-card">
  <!-- Error -->

  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <!-- Success -->

  <div *ngIf="successMessage" class="success-message">
    {{ successMessage }}
  </div>

  <form #roleForm="ngForm" (ngSubmit)="saveRole(roleForm)" novalidate>
    <!-- Role Name -->

    <div class="form-group">
      <label for="name"> Role Name <span>*</span> </label>

      <input
        id="name"
        name="name"
        type="text"
        [(ngModel)]="name"
        required
        minlength="2"
        maxlength="100"
        #nameControl="ngModel"
        placeholder="e.g. Editor"
      />

      <div *ngIf="nameControl.invalid && nameControl.touched" class="field-error">
        <span *ngIf="nameControl.errors?.['required']"> Role name is required. </span>

        <span *ngIf="nameControl.errors?.['minlength']">
          Role name must be at least 2 characters.
        </span>
      </div>
    </div>

    <!-- Actions -->

    <div class="form-actions">
      <button type="button" class="cancel-btn" [disabled]="isSaving" (click)="cancel()">
        Cancel
      </button>

      <button type="submit" class="save-btn" [disabled]="isSaving">
        <span *ngIf="!isSaving">
          {{ isEditMode ? 'Update Role' : 'Create Role' }}
        </span>

        <span *ngIf="isSaving"> Saving... </span>
      </button>
    </div>
  </form>
</div>
