      </a>

      <a
        routerLink="/category/india"
        routerLinkActive="active"

        routerLink="/category/technology"
        routerLinkActive="active"
        (click)="closeMobileMenu()"

        routerLink="/category/business"
        routerLinkActive="active"

        Business
      </a>

      <a
        routerLink="/category/sports"
        routerLinkActive="active"
        (click)="closeMobileMenu()"

      </a>

      <a
        routerLink="/category/entertainment"
        routerLinkActive="active"

        routerLink="/category/health"
        routerLinkActive="active"
        (click)="closeMobileMenu()"
      >
        Health
      </a>

      <a
        routerLink="/category/lifestyle"
        routerLinkActive="active"
        (click)="closeMobileMenu()"
      >
        Lifestyle
      </a>

      <a
        routerLink="/category/education"
        routerLinkActive="active"
        (click)="closeMobileMenu()"
      >
        Education
      </a>

    </div>


    <!-- More -->

    <button
      type="button"
      class="more-btn"
      aria-label="More categories"
    >
      More

    </button>

  </div>
