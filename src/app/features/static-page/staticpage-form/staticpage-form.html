<div class="page-header">
  <div>
    <h1>
      {{ isEditMode ? 'Edit Static Page' : 'Add Static Page' }}
    </h1>

    <p>Website Page Information</p>
  </div>

  <a routerLink="/static-pages" class="back-btn"> Back </a>
</div>

<div class="form-card">
  <div class="error-message" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <form *ngIf="!isLoading" (ngSubmit)="save()">
    <div class="form-group">
      <label>Title *</label>

      <input type="text" name="title" [(ngModel)]="page.title" />
    </div>

    <div class="form-group">
      <label>Slug *</label>

      <input type="text" name="slug" [(ngModel)]="page.slug" />
    </div>

    <div class="form-group">
      <label>Content *</label>

      <textarea rows="8" name="content" [(ngModel)]="page.content"></textarea>
    </div>

    <div class="form-group">
      <label>Meta Title *</label>

      <input type="text" name="metaTitle" [(ngModel)]="page.metaTitle" />
    </div>

    <div class="form-group">
      <label>Meta Description</label>

      <textarea rows="3" name="metaDescription" [(ngModel)]="page.metaDescription"></textarea>
    </div>

    <div class="form-group">
      <label>Meta Keywords</label>

      <input type="text" name="metaKeywords" [(ngModel)]="page.metaKeywords" />
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="status" name="status" [(ngModel)]="page.status" />

      <label for="status"> Active </label>
    </div>

    <div class="form-actions">
      <a routerLink="/static-pages" class="cancel-btn"> Cancel </a>

      <button type="submit" [disabled]="isSaving">
        {{ isSaving ? 'Saving...' : isEditMode ? 'Update Page' : 'Save Page' }}
      </button>
    </div>
  </form>
</div>
