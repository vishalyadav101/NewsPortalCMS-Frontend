<div class="page-header">
  <div>
    <h1>
      {{ isEditMode ? 'Edit News' : 'Add News' }}
    </h1>

    <p>
      {{ isEditMode ? 'Update news article' : 'Create a new news article' }}
    </p>
  </div>

  <a routerLink="/news" class="back-btn">Back</a>
</div>

<div class="form-card">
  <!-- Loading -->
  <div *ngIf="isLoading" class="loading">Loading...</div>

  <!-- Error -->
  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <form *ngIf="!isLoading" (ngSubmit)="save()">
    <!-- ========================================== -->
    <!-- CATEGORY -->
    <!-- ========================================== -->

    <div class="form-group">
      <label for="categoryId"> Category * </label>

      <select
        id="categoryId"
        name="categoryId"
        [(ngModel)]="news.categoryId"
        (ngModelChange)="onCategoryChange()"
      >
        <option [ngValue]="0">Select Category</option>

        <option *ngFor="let category of categories" [ngValue]="category.id">
          {{ category.name }}
        </option>
      </select>
    </div>

    <!-- ========================================== -->
    <!-- SUB CATEGORY -->
    <!-- ========================================== -->

    <div class="form-group">
      <label for="subCategoryId"> Sub Category </label>

      <select
        id="subCategoryId"
        name="subCategoryId"
        [(ngModel)]="news.subCategoryId"
        [disabled]="!news.categoryId || filteredSubCategories.length === 0"
      >
        <option [ngValue]="0">
          {{
            !news.categoryId
              ? 'Select Category First'
              : filteredSubCategories.length === 0
                ? 'No Sub Category Available'
                : 'Select Sub Category'
          }}
        </option>

        <option *ngFor="let subCategory of filteredSubCategories" [ngValue]="subCategory.id">
          {{ subCategory.name }}
        </option>
      </select>
    </div>

    <!-- ========================================== -->
    <!-- TITLE -->
    <!-- ========================================== -->

    <div class="form-group">
      <label for="title"> Title * </label>

      <input
        id="title"
        type="text"
        name="title"
        [(ngModel)]="news.title"
        placeholder="Enter news title"
      />
    </div>

    <!-- ========================================== -->
    <!-- SLUG -->
    <!-- ========================================== -->

    <div class="form-group">
      <label for="slug"> Slug * </label>

      <input
        id="slug"
        type="text"
        name="slug"
        [(ngModel)]="news.slug"
        placeholder="example-angular-news"
      />
    </div>

    <!-- ========================================== -->
    <!-- SHORT DESCRIPTION -->
    <!-- ========================================== -->

    <div class="form-group">
      <label for="shortDescription"> Short Description </label>

      <textarea
        id="shortDescription"
        name="shortDescription"
        [(ngModel)]="news.shortDescription"
        rows="3"
        placeholder="Enter short description"
      ></textarea>
    </div>

    <!-- ========================================== -->
    <!-- CONTENT -->
    <!-- ========================================== -->

    <div class="form-group">
      <label for="content"> Content </label>

      <textarea
        id="content"
        name="content"
        [(ngModel)]="news.content"
        rows="8"
        placeholder="Enter news content"
      ></textarea>
    </div>

    <!-- ========================================== -->
    <!-- FEATURED IMAGE -->
    <!-- ========================================== -->

    <div class="form-group">
      <label for="featuredImage"> Featured Image </label>

      <input id="featuredImage" type="file" accept="image/*" (change)="onFileSelected($event)" />
    </div>

    <!-- IMAGE PREVIEW -->

    <div class="image-preview" *ngIf="selectedImagePreview">
      <img [src]="selectedImagePreview" alt="Preview" />
    </div>

    <!-- ========================================== -->
    <!-- FEATURED VIDEO / PDF -->
    <!-- ========================================== -->

    <div class="form-group">
      <label for="featuredVideo"> Featured Video </label>

      <input
        id="featuredVideo"
        type="file"
        accept="video/*,.pdf"
        (change)="onVideoSelected($event)"
      />
    </div>

    <!-- VIDEO PREVIEW -->

    <div
      class="video-preview"
      *ngIf="selectedVideoPreview && !selectedVideoPreview.toLowerCase().endsWith('.pdf')"
    >
      <video [src]="selectedVideoPreview" controls></video>
    </div>

    <!-- PDF PREVIEW -->

    <div
      class="image-preview"
      *ngIf="selectedVideoPreview && selectedVideoPreview.toLowerCase().endsWith('.pdf')"
    >
      <img src="assets/icons/pdf.png" alt="PDF" class="news-image" />
    </div>

    <!-- ========================================== -->
    <!-- AUTHOR -->
    <!-- ========================================== -->

    <div class="form-group">
      <label for="author"> Author * </label>

      <input
        id="author"
        type="text"
        name="author"
        [(ngModel)]="news.author"
        placeholder="Enter author name"
      />
    </div>

    <!-- ========================================== -->
    <!-- PUBLISH DATE -->
    <!-- ========================================== -->

    <div class="form-group">
      <label for="publishDate"> Publish Date * </label>

      <input
        id="publishDate"
        type="datetime-local"
        name="publishDate"
        [(ngModel)]="news.publishDate"
      />
    </div>

    <!-- ========================================== -->
    <!-- PUBLISHED -->
    <!-- ========================================== -->

    <div class="checkbox-group">
      <input id="isPublished" type="checkbox" name="isPublished" [(ngModel)]="news.isPublished" />

      <label for="isPublished"> Published </label>
    </div>

    <!-- ========================================== -->
    <!-- FEATURED -->
    <!-- ========================================== -->

    <div class="checkbox-group">
      <input id="isFeatured" type="checkbox" name="isFeatured" [(ngModel)]="news.isFeatured" />

      <label for="isFeatured"> Featured News </label>
    </div>

    <!-- ========================================== -->
    <!-- BUTTONS -->
    <!-- ========================================== -->

    <div class="form-actions">
      <a routerLink="/news" class="cancel-btn"> Cancel </a>

      <button type="submit" [disabled]="isSaving">
        {{ isSaving ? 'Saving...' : isEditMode ? 'Update News' : 'Save News' }}
      </button>
    </div>
  </form>
</div>
